<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Dashboard</title>
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('pr-dashboard:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
} catch {
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f3;
    --panel: #ffffff;
    --ink: #1c1d1f;
    --muted: #6b6e73;
    --line: #e4e3de;
    --hover: #f0efea;
    --active: #e9eefc;
    --accent: #2f5bd8;
    --red: #c4372b;
    --red-bg: #fbe9e6;
    --amber: #a36200;
    --amber-bg: #fdf1dc;
    --green: #1f7a46;
    --green-bg: #e3f3e8;
    --blue-bg: #e7edfc;
    --grey-bg: #ecebe6;
    --code-bg: #f1f0eb;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141517;
    --panel: #1b1c1f;
    --ink: #e7e6e2;
    --muted: #9a9ca1;
    --line: #2c2d31;
    --hover: #232428;
    --active: #222b44;
    --accent: #7c9bff;
    --red: #ff8a7d;
    --red-bg: #3a1f1c;
    --amber: #f0b45c;
    --amber-bg: #352a17;
    --green: #6fd39a;
    --green-bg: #17301f;
    --blue-bg: #1f2945;
    --grey-bg: #26272b;
    --code-bg: #24252a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, select, textarea { font: inherit; color: inherit; }
  button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .meta { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  .theme { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; color: var(--muted); }
  .theme:hover:not(:disabled) { color: var(--ink); }
  header label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
  .viewbar { display: flex; flex-wrap: wrap; gap: 10px; }
  .viewbar select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); max-width: 260px; }
  .queue { font-size: 13px; color: var(--amber); }
  .error { color: var(--red); font-size: 13px; }

  main { display: grid; grid-template-columns: minmax(360px, 34%) 1fr; min-height: 0; }
  .list { overflow: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .group h2 {
    position: sticky; top: 0; z-index: 1; margin: 0; padding: 10px 16px 6px;
    font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .row { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; background: transparent; }
  .row:hover { background: var(--hover); }
  .row.selected { background: var(--active); }
  .row .top { display: flex; gap: 8px; align-items: baseline; }
  .row .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .row .title { font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .title.unseen::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: middle; }
  .row .sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: 12px; color: var(--muted); }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-blue { background: var(--blue-bg); color: var(--accent); }
  .b-grey { background: var(--grey-bg); color: var(--muted); }

  .detail { overflow: auto; padding: 24px 32px 64px; }
  .detail .empty { color: var(--muted); margin-top: 40px; text-align: center; }
  .list .empty { color: var(--muted); margin: 0; }
  .detail h2 { margin: 0 0 6px; font-size: 20px; line-height: 1.3; }
  .detail .info { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0; }
  .toolbar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  textarea.note { width: 100%; min-height: 60px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); resize: vertical; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 20px; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 8px 14px; color: var(--muted); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tabmeta { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); margin: 12px 0; flex-wrap: wrap; }
  .notice { padding: 10px 12px; border-radius: 6px; background: var(--amber-bg); color: var(--amber); font-size: 13px; margin: 12px 0; }
  .notice.err { background: var(--red-bg); color: var(--red); white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .md { max-width: 900px; }
  .md h1, .md h2, .md h3 { line-height: 1.3; margin: 1.4em 0 .5em; }
  .md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; }
  .md code { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow: auto; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 12px 0; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--hover); }
  .md li { margin: 3px 0; }
  .md img, .md video { max-width: 100%; height: auto; border-radius: 6px; }
  .md blockquote { margin: 12px 0; padding: 0 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .md .task-list-item { list-style: none; }
  .md .task-list-item input { margin: 0 6px 0 -18px; }
  .md details { margin: 12px 0; }
  .md summary { cursor: pointer; font-weight: 500; }
  .description { margin-top: 16px; }

  .label { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border: 1px solid var(--line); border-radius: 10px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .label i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .filters button { padding: 2px 9px; border-radius: 12px; font-size: 12px; }
  .filters button.on { background: var(--active); border-color: var(--accent); color: var(--accent); }

  .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / .35); }
  .dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 40px rgb(0 0 0 / .25); }
  .dialog h2 { margin: 0; padding: 16px 20px; font-size: 16px; border-bottom: 1px solid var(--line); }
  .dialog .body { padding: 16px 20px; overflow: auto; display: grid; gap: 16px; }
  .dialog .foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .field { display: grid; gap: 6px; }
  .field > span { font-weight: 500; }
  .field small { color: var(--muted); }
  .field input[type=text] { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); font: inherit; color: inherit; }
  .labels { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .labels label { display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .labels label:last-child { border-bottom: 0; }
  .labels label:hover { background: var(--hover); }
  .labels .desc { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
  .check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .picker { display: grid; gap: 6px; }
  .repo { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 8px; }
  .repo-head { display: flex; align-items: center; gap: 10px; }
  .repo-head .meta { flex: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.link { border: 0; background: none; padding: 0; text-align: left; }
  button.link:hover { background: none; color: var(--accent); }
  button.pick { display: flex; gap: 10px; align-items: baseline; width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; background: transparent; }
  button.pick:last-child { border-bottom: 0; }
  .labels .err { color: var(--red); }
  .repo-chip { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    .list { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .detail { padding: 16px; }
    header { flex-wrap: wrap; padding: 12px 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script type="importmap">
{ "imports": {
  "preact": "https://cdn.jsdelivr.net/npm/preact@10.22.1/dist/preact.module.js",
  "preact/hooks": "https://cdn.jsdelivr.net/npm/preact@10.22.1/hooks/dist/hooks.module.js",
  "htm": "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js"
} }
</script>
<script type="module">
import { h, render } from 'preact';
import { useState, useEffect, useMemo, useCallback, useRef } from 'preact/hooks';
import htm from 'htm';

const html = htm.bind(h);

const STATUSES = { '': 'Pas de statut', todo: 'À faire', doing: 'En cours', ok: 'OK pour moi', blocked: 'Bloqué' };
const KIND_LABEL = { brief: 'Brief', deep: 'Deep review' };
const TABS = { description: 'Description', ...KIND_LABEL };

DOMPurify.addHook('afterSanitizeAttributes', (node) => {
  if (node.tagName === 'A' && /^https?:/.test(node.getAttribute('href') || '')) {
    node.setAttribute('target', '_blank');
    node.setAttribute('rel', 'noopener');
  }
});

const viewQuery = ({ repo, label, state }) => new URLSearchParams(Object.entries({ repo, label, state }).filter(([, v]) => v && v !== 'open')).toString();
const prPath = (key) => `/api/prs/${key.replace('#', '/')}`;
const shortRepo = (name) => name.split('/')[1];

const api = {
  list: (view) => fetch(`/api/prs?${viewQuery(view)}`).then((r) => r.json()),
  refresh: (view) => fetch(`/api/refresh?${viewQuery(view)}`, { method: 'POST' }).then((r) => r.json()),
  local: (key, patch) => fetch(`${prPath(key)}/local`, { method: 'POST', body: JSON.stringify(patch) }).then((r) => r.json()),
  launch: (key, kind, force) => fetch(`${prPath(key)}/${kind}${force ? '?force' : ''}`, { method: 'POST' }).then((r) => r.json()),
  analysis: (key, kind) => fetch(`${prPath(key)}/${kind}`).then((r) => (r.ok ? r.json() : null)),
  description: (key) => fetch(`${prPath(key)}/description`).then(async (r) => (r.ok ? r.json() : Promise.reject(new Error((await r.json()).error)))),
  repos: () => fetch('/api/repos').then(async (r) => (r.ok ? r.json() : Promise.reject(new Error((await r.json()).error)))),
  labels: (repo) => fetch(`/api/labels?repo=${encodeURIComponent(repo)}`).then(async (r) => (r.ok ? r.json() : Promise.reject(new Error((await r.json()).error)))),
  saveSettings: (settings) => fetch('/api/settings', { method: 'POST', body: JSON.stringify(settings) }).then(async (r) => (r.ok ? r.json() : Promise.reject(new Error((await r.json()).error)))),
};

function Label({ label }) {
  return html`<span class="label"><i style=${{ background: `#${label.color}` }}></i>${label.name}</span>`;
}

function ago(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
  return `il y a ${Math.round(s / 86400)} j`;
}

function priority(pr) {
  if (pr.isDraft) return 'drafts';
  if (pr.isMine) return 'mine';
  if (pr.local.status === 'ok' && pr.myReview.status !== 'outdated' && !pr.repliesToMe) return 'done';
  if (pr.repliesToMe || pr.myReview.status === 'never' || pr.myReview.status === 'outdated') return 'todo';
  return 'done';
}

function score(pr) {
  let s = 0;
  if (pr.repliesToMe) s += 1000;
  if (pr.requested) s += 500;
  if (pr.myReview.status === 'outdated') s += 300;
  if (pr.myReview.status === 'never') s += 200;
  if (isUnseen(pr)) s += 100;
  return s - new Date(pr.updatedAt).getTime() / 1e13;
}

function isUnseen(pr) {
  return !pr.local.seenAt || pr.updatedAt > pr.local.seenAt;
}

function ReviewBadge({ pr }) {
  const r = pr.myReview;
  if (r.status === 'never') return html`<span class="badge b-red">Jamais vue</span>`;
  if (r.status === 'outdated') return html`<span class="badge b-amber">Commits depuis ta review</span>`;
  const label = r.state === 'APPROVED' ? 'Approuvée' : r.state === 'CHANGES_REQUESTED' ? 'Changes demandés' : 'Review à jour';
  return html`<span class="badge b-green">${label}</span>`;
}

function StateBadge({ pr }) {
  if (pr.state === 'MERGED') return html`<span class="badge b-green">Mergée ${ago(pr.mergedAt)}</span>`;
  if (pr.state === 'CLOSED') return html`<span class="badge b-grey">Fermée ${ago(pr.closedAt)}</span>`;
  return null;
}

function JobBadge({ job, kind }) {
  if (!job) return null;
  const map = {
    queued: ['b-grey', 'en file'],
    running: ['b-amber', 'en cours…'],
    done: ['b-blue', 'prêt'],
    error: ['b-red', 'erreur'],
    interrupted: ['b-red', 'interrompu'],
  };
  const [cls, label] = map[job.status] || ['b-grey', job.status];
  return html`<span class="badge ${cls}">${KIND_LABEL[kind]} ${label}</span>`;
}

function Row({ pr, selected, onSelect, showLabels, showRepo }) {
  const briefUnread = pr.brief?.status === 'done' && pr.local.briefReadSha !== pr.brief.sha;
  return html`
    <button class="row ${selected ? 'selected' : ''}" onClick=${() => onSelect(pr.key)}>
      <div class="top">
        <span class="num">${showRepo ? `${shortRepo(pr.repo)} ` : ''}#${pr.number}</span>
        <span class="title ${pr.state === 'OPEN' && isUnseen(pr) ? 'unseen' : ''}">${pr.title}</span>
      </div>
      <div class="sub">
        <span>${pr.author}</span>
        ${showLabels && pr.labels.map((l) => html`<${Label} key=${l.name} label=${l} />`)}
        <${StateBadge} pr=${pr} />
        ${!pr.isDraft && !pr.isMine && pr.state === 'OPEN' && html`<${ReviewBadge} pr=${pr} />`}
        ${pr.repliesToMe > 0 && html`<span class="badge b-red">${pr.repliesToMe} réponse${pr.repliesToMe > 1 ? 's' : ''} à toi</span>`}
        ${pr.requested && pr.state === 'OPEN' && html`<span class="badge b-blue">Review demandée</span>`}
        ${pr.local.status && html`<span class="badge b-grey">${STATUSES[pr.local.status]}</span>`}
        ${briefUnread && html`<span class="badge b-blue">Brief non lu</span>`}
        ${pr.brief && pr.brief.status !== 'done' && html`<${JobBadge} job=${pr.brief} kind="brief" />`}
        ${pr.deep && html`<${JobBadge} job=${pr.deep} kind="deep" />`}
      </div>
    </button>`;
}

function githubLinks(markdown, repo, sha) {
  const renderer = new marked.Renderer();
  const base = renderer.link.bind(renderer);
  renderer.link = (href, title, text) => {
    if (href && !/^[a-z]+:|^#/i.test(href)) {
      const m = href.match(/^(.*?)(?::(\d+))?$/);
      href = `https://github.com/${repo}/blob/${sha}/${m[1].replace(/^\.?\//, '')}${m[2] ? `#L${m[2]}` : ''}`;
    }
    return base(href, title, text).replace('<a ', '<a target="_blank" rel="noopener" ');
  };
  return DOMPurify.sanitize(marked.parse(markdown, { renderer, gfm: true }), { ADD_ATTR: ['target'] });
}

function Analysis({ pr, kind, repo, onLaunch }) {
  const job = pr[kind];
  const [doc, setDoc] = useState(null);
  const key = `${pr.key}-${kind}-${job?.status}-${job?.finishedAt}`;

  useEffect(() => {
    setDoc(null);
    if (job?.status === 'done' || job?.hasPrevious) api.analysis(pr.key, kind).then(setDoc);
  }, [key]);

  const busy = job && (job.status === 'queued' || job.status === 'running');
  const stale = doc && doc.sha !== pr.headSha;

  return html`
    <div>
      <div class="tabmeta">
        ${doc && html`<span>Analyse du commit <code>${doc.sha.slice(0, 7)}</code>, ${ago(doc.finishedAt)}</span>`}
        ${doc?.cost != null && html`<span>· ${doc.cost.toFixed(2)} $</span>`}
        ${busy && html`<${JobBadge} job=${job} kind=${kind} />`}
        <span style="flex:1"></span>
        ${!busy && html`<button class=${!job ? 'primary' : ''} onClick=${() => onLaunch(kind, !!job)}>
          ${job ? 'Relancer' : `Lancer la ${KIND_LABEL[kind].toLowerCase()}`}
        </button>`}
      </div>
      ${stale && html`<div class="notice">La PR a reçu des commits depuis cette analyse.</div>`}
      ${(job?.status === 'error' || job?.status === 'interrupted') && html`<div class="notice err">${job.error || 'Analyse interrompue par un redémarrage du serveur.'}</div>`}
      ${!job && kind === 'brief' && pr.isDraft && html`<p class="empty">Draft : pas d'analyse automatique.</p>`}
      ${!job && kind === 'deep' && html`<p class="empty">La deep review se lance à la demande. Elle prend plusieurs minutes.</p>`}
      ${doc && html`<div class="md" dangerouslySetInnerHTML=${{ __html: githubLinks(doc.markdown, repo, doc.sha) }}></div>`}
    </div>`;
}

function Description({ pr }) {
  const [doc, setDoc] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    setError(null);
    api.description(pr.key).then(setDoc).catch((e) => setError(e.message));
  }, [pr.key, pr.updatedAt]);

  if (error) return html`<div class="notice err">${error}</div>`;
  if (!doc) return html`<p class="empty">Chargement de la description…</p>`;
  if (!doc.html.trim()) return html`<p class="empty">Pas de description sur cette PR.</p>`;
  return html`<div class="md description" dangerouslySetInnerHTML=${{ __html: DOMPurify.sanitize(doc.html, { ADD_ATTR: ['target'] }) }}></div>`;
}

function Detail({ pr, onLocal, onLaunch }) {
  const [tab, setTab] = useState('description');
  const [note, setNote] = useState(pr.local.note || '');

  useEffect(() => {
    setNote(pr.local.note || '');
    if (isUnseen(pr)) onLocal(pr.key, { seenAt: new Date().toISOString() });
  }, [pr.key]);

  const briefUnread = pr.brief?.status === 'done' && pr.local.briefReadSha !== pr.brief.sha;

  return html`
    <div>
      <h2><a href=${pr.url} target="_blank" rel="noopener">${shortRepo(pr.repo)}#${pr.number}</a> ${pr.title}</h2>
      <div class="info">
        <span>${pr.author}</span>
        <span>+${pr.size.additions} −${pr.size.deletions} · ${pr.size.files} fichiers</span>
        <span>Dernier commit ${ago(pr.lastCommitAt)}</span>
        ${pr.myReview.at && html`<span>Ta dernière review ${ago(pr.myReview.at)}</span>`}
        ${pr.openThreads > 0 && html`<span>${pr.openThreads} thread${pr.openThreads > 1 ? 's' : ''} ouvert${pr.openThreads > 1 ? 's' : ''}</span>`}
        ${pr.newComments > 0 && html`<span>${pr.newComments} commentaire${pr.newComments > 1 ? 's' : ''} depuis ta review</span>`}
      </div>
      <div class="toolbar">
        <${StateBadge} pr=${pr} />
        ${!pr.isDraft && !pr.isMine && pr.state === 'OPEN' && html`<${ReviewBadge} pr=${pr} />`}
        <select value=${pr.local.status || ''} onChange=${(e) => onLocal(pr.key, { status: e.target.value })}>
          ${Object.entries(STATUSES).map(([v, l]) => html`<option value=${v}>${l}</option>`)}
        </select>
        ${briefUnread && html`<button onClick=${() => onLocal(pr.key, { briefReadSha: pr.brief.sha })}>Marquer le brief comme lu</button>`}
        <a href=${`${pr.url}/files`} target="_blank" rel="noopener">Voir les fichiers sur GitHub</a>
      </div>
      <textarea class="note" placeholder="Note perso…" value=${note}
        onInput=${(e) => setNote(e.target.value)}
        onBlur=${() => note !== (pr.local.note || '') && onLocal(pr.key, { note })}></textarea>
      <div class="tabs">
        ${Object.entries(TABS).map(([k, label]) => html`<button class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${label}</button>`)}
      </div>
      ${tab === 'description'
        ? html`<${Description} pr=${pr} />`
        : html`<${Analysis} key=${`${pr.key}-${tab}`} pr=${pr} kind=${tab} repo=${pr.repo} onLaunch=${(kind, force) => onLaunch(pr.key, kind, force)} />`}
    </div>`;
}

function LabelPicker({ repo, selected, onToggle }) {
  const [available, setAvailable] = useState(null);
  const [error, setError] = useState(null);
  const [query, setQuery] = useState('');

  useEffect(() => {
    api.labels(repo).then(setAvailable).catch((e) => setError(e.message));
  }, [repo]);

  const shown = (available || []).filter((l) => l.name.toLowerCase().includes(query.toLowerCase()));
  const sorted = [...shown.filter((l) => selected.includes(l.name)), ...shown.filter((l) => !selected.includes(l.name))];

  return html`
    <div class="picker">
      <input type="text" placeholder="Filtrer les labels…" value=${query} onInput=${(e) => setQuery(e.target.value)} />
      <div class="labels">
        ${!available && !error && html`<label>Chargement des labels…</label>`}
        ${error && html`<label class="err">${error}</label>`}
        ${available && available.length === 0 && html`<label>Aucun label sur ce repo.</label>`}
        ${sorted.map((l) => html`
          <label key=${l.name}>
            <input type="checkbox" checked=${selected.includes(l.name)} onChange=${() => onToggle(l.name)} />
            <${Label} label=${l} />
            <span class="desc">${l.description}</span>
          </label>`)}
      </div>
    </div>`;
}

function RepoAdder({ chosen, onAdd }) {
  const [repos, setRepos] = useState(null);
  const [error, setError] = useState(null);
  const [query, setQuery] = useState('');

  useEffect(() => {
    api.repos().then(setRepos).catch((e) => setError(e.message));
  }, []);

  const q = query.trim().toLowerCase();
  const matches = (repos || [])
    .filter((r) => !chosen.includes(r.name) && (!q || r.name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)))
    .slice(0, 30);
  const manual = /^[\w.-]+\/[\w.-]+$/.test(query.trim()) && !chosen.includes(query.trim()) && !matches.some((r) => r.name === query.trim());

  const add = (name) => {
    onAdd(name);
    setQuery('');
  };

  return html`
    <div class="picker">
      <input type="text" placeholder=${repos ? `Chercher parmi ${repos.length} repos…` : 'Chargement des repos…'} value=${query}
        onInput=${(e) => setQuery(e.target.value)}
        onKeyDown=${(e) => e.key === 'Enter' && (matches[0] ? add(matches[0].name) : manual && add(query.trim()))} />
      ${error && html`<div class="notice err">${error}</div>`}
      ${q && html`
        <div class="labels">
          ${manual && html`<button class="pick" onClick=${() => add(query.trim())}>Ajouter <code>${query.trim()}</code></button>`}
          ${matches.map((r) => html`
            <button class="pick" key=${r.name} onClick=${() => add(r.name)}>
              <strong>${r.name}</strong>
              <span class="desc">${r.description || ''}</span>
            </button>`)}
          ${repos && !manual && matches.length === 0 && html`<label>Aucun repo trouvé.</label>`}
        </div>`}
    </div>`;
}

function Settings({ current, onClose, onSaved }) {
  const [repos, setRepos] = useState(current.repos.map((r) => ({ ...r })));
  const [open, setOpen] = useState(current.repos.length === 1 ? current.repos[0].name : null);
  const [autoBrief, setAutoBrief] = useState(current.autoBrief);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, []);

  const addRepo = (name) => {
    setRepos((prev) => [...prev, { name, labels: [] }]);
    setOpen(name);
  };
  const removeRepo = (name) => setRepos((prev) => prev.filter((r) => r.name !== name));
  const toggleLabel = (name, label) => setRepos((prev) => prev.map((r) => {
    if (r.name !== name) return r;
    const labels = r.labels.includes(label) ? r.labels.filter((l) => l !== label) : [...r.labels, label];
    return { ...r, labels };
  }));

  const save = async () => {
    setSaving(true);
    setError(null);
    try {
      onSaved(await api.saveSettings({ repos, autoBrief }));
    } catch (e) {
      setError(e.message);
      setSaving(false);
    }
  };

  return html`
    <div class="overlay" onClick=${(e) => e.target === e.currentTarget && onClose()}>
      <div class="dialog" role="dialog" aria-modal="true" aria-label="Réglages">
        <h2>Réglages</h2>
        <div class="body">
          <div class="field">
            <span>Repos suivis · ${repos.length}</span>
            <small>Pour chaque repo, une PR est listée si elle porte au moins un des labels cochés. Aucun label coché : toutes les PR ouvertes du repo.</small>
            ${repos.map((r) => html`
              <div class="repo" key=${r.name}>
                <div class="repo-head">
                  <button class="link" onClick=${() => setOpen(open === r.name ? null : r.name)} aria-expanded=${open === r.name}>
                    ${open === r.name ? '▾' : '▸'} <strong>${r.name}</strong>
                  </button>
                  <span class="meta">${r.labels.length ? r.labels.join(', ') : 'toutes les PR'}</span>
                  <button onClick=${() => removeRepo(r.name)} aria-label=${`Retirer ${r.name}`}>Retirer</button>
                </div>
                ${open === r.name && html`<${LabelPicker} repo=${r.name} selected=${r.labels} onToggle=${(label) => toggleLabel(r.name, label)} />`}
              </div>`)}
          </div>
          <div class="field">
            <span>Ajouter un repo</span>
            <small>Les repos de tes organisations GitHub et les tiens, visibles par <code>gh</code>.</small>
            <${RepoAdder} chosen=${repos.map((r) => r.name)} onAdd=${addRepo} />
          </div>
          <label class="check">
            <input type="checkbox" checked=${autoBrief} onChange=${(e) => setAutoBrief(e.target.checked)} />
            Lancer le brief automatiquement sur chaque PR, hors drafts et hors des miennes
          </label>
          ${error && html`<div class="notice err">${error}</div>`}
        </div>
        <div class="foot">
          <button onClick=${onClose}>Annuler</button>
          <button class="primary" onClick=${save} disabled=${saving}>${saving ? 'Enregistrement…' : 'Enregistrer'}</button>
        </div>
      </div>
    </div>`;
}

const THEME_KEY = 'pr-dashboard:theme';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');

function ThemeToggle() {
  const [theme, setTheme] = useState(document.documentElement.dataset.theme);

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => {
    const onChange = (e) => {
      try {
        if (localStorage.getItem(THEME_KEY)) return;
      } catch {}
      setTheme(e.matches ? 'dark' : 'light');
    };
    darkQuery.addEventListener('change', onChange);
    return () => darkQuery.removeEventListener('change', onChange);
  }, []);

  const toggle = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    try {
      localStorage.setItem(THEME_KEY, next);
    } catch {}
    setTheme(next);
  };
  const dark = theme === 'dark';

  return html`
    <button class="theme" onClick=${toggle} aria-label=${dark ? 'Passer en mode clair' : 'Passer en mode sombre'} title=${dark ? 'Mode clair' : 'Mode sombre'}>
      ${dark
        ? html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
        : html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`}
    </button>`;
}

const GROUPS = {
  open: [
    ['todo', 'À voir'],
    ['done', 'À jour'],
    ['drafts', 'Drafts'],
    ['mine', 'Mes PR'],
  ],
  closed: [
    ['merged', 'Mergées'],
    ['closed', 'Fermées sans merge'],
    ['mine', 'Mes PR'],
  ],
};

const VIEW_KEY = 'pr-dashboard:view';
const DEFAULT_VIEW = { repo: '', label: '', state: 'open' };

function readView() {
  try {
    return { ...DEFAULT_VIEW, ...JSON.parse(localStorage.getItem(VIEW_KEY) || '{}') };
  } catch {
    return DEFAULT_VIEW;
  }
}

function writeView(view) {
  try {
    localStorage.setItem(VIEW_KEY, JSON.stringify(view));
  } catch {}
}

function closedPriority(pr) {
  if (pr.isMine) return 'mine';
  return pr.state === 'MERGED' ? 'merged' : 'closed';
}

function ViewBar({ view, setView, repos }) {
  const [labelsByRepo, setLabelsByRepo] = useState({});

  useEffect(() => {
    if (!view.repo || labelsByRepo[view.repo]) return;
    api.labels(view.repo)
      .then((labels) => setLabelsByRepo((prev) => ({ ...prev, [view.repo]: labels.map((l) => l.name) })))
      .catch(() => setLabelsByRepo((prev) => ({ ...prev, [view.repo]: [] })));
  }, [view.repo]);

  const scope = view.repo ? repos.filter((r) => r.name === view.repo) : repos;
  const followed = [...new Set(scope.flatMap((r) => r.labels))];
  const available = view.repo ? labelsByRepo[view.repo] : followed;
  const others = (available || []).filter((l) => !followed.includes(l));
  const followedHint = followed.length ? followed.join(', ') : 'tous';

  return html`
    <div class="viewbar">
      <label>
        <span>Repo</span>
        <select value=${view.repo} onChange=${(e) => setView({ ...view, repo: e.target.value, label: '' })}>
          <option value="">Tous les repos</option>
          ${repos.map((r) => html`<option key=${r.name} value=${r.name}>${shortRepo(r.name)}</option>`)}
        </select>
      </label>
      <label>
        <span>Label</span>
        <select value=${view.label} onChange=${(e) => setView({ ...view, label: e.target.value })}>
          <option value="">Labels suivis (${followedHint})</option>
          <option value="*">Toutes les PR</option>
          ${followed.length > 0 && html`<optgroup label="Suivis">${followed.map((l) => html`<option key=${l} value=${l}>${l}</option>`)}</optgroup>`}
          ${others.length > 0 && html`<optgroup label="Autres labels du repo">${others.map((l) => html`<option key=${l} value=${l}>${l}</option>`)}</optgroup>`}
          ${view.repo && !available && html`<option disabled>Chargement des labels…</option>`}
        </select>
      </label>
      <label>
        <span>État</span>
        <select value=${view.state} onChange=${(e) => setView({ ...view, state: e.target.value })}>
          <option value="open">Ouvertes</option>
          <option value="closed">Fermées</option>
        </select>
      </label>
    </div>`;
}

function App() {
  const [data, setData] = useState(null);
  const [view, setViewState] = useState(readView);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(() => decodeURIComponent(location.hash.slice(1)) || null);
  const [showMine, setShowMine] = useState(false);
  const [showDrafts, setShowDrafts] = useState(true);
  const [refreshing, setRefreshing] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const viewRef = useRef(view);

  const setView = (next) => {
    viewRef.current = next;
    writeView(next);
    setViewState(next);
  };

  const load = useCallback(() => {
    const asked = viewRef.current;
    return api.list(asked)
      .then((next) => {
        if (viewRef.current !== asked) return;
        setData(next);
        setLoading(false);
      })
      .catch(() => {});
  }, []);

  useEffect(() => {
    setLoading(true);
    load();
  }, [view]);

  useEffect(() => {
    const busy = data?.queue?.length > 0;
    const t = setInterval(load, busy ? 5000 : 30000);
    return () => clearInterval(t);
  }, [data?.queue?.length]);

  useEffect(() => { if (selected) history.replaceState(null, '', `#${encodeURIComponent(selected)}`); }, [selected]);

  const followedRepos = data?.settings.repos || [];

  useEffect(() => {
    if (data && view.repo && !followedRepos.some((r) => r.name === view.repo)) setView({ ...view, repo: '', label: '' });
  }, [followedRepos.map((r) => r.name).join()]);
  useEffect(() => { if (data && followedRepos.length === 0) setSettingsOpen(true); }, [!!data, followedRepos.length]);

  const closed = view.state === 'closed';
  const groups = useMemo(() => {
    if (!data) return [];
    const by = {};
    for (const pr of data.prs) (by[closed ? closedPriority(pr) : priority(pr)] ??= []).push(pr);
    const order = closed
      ? (a, b) => (b.closedAt || '').localeCompare(a.closedAt || '')
      : (a, b) => score(b) - score(a);
    return GROUPS[closed ? 'closed' : 'open']
      .filter(([k]) => (k !== 'mine' || showMine) && (k !== 'drafts' || showDrafts))
      .map(([k, label]) => [k, label, (by[k] || []).sort(order)])
      .filter(([, , list]) => list.length);
  }, [data, showMine, showDrafts, closed]);

  const onLocal = async (key, patch) => {
    await api.local(key, patch);
    load();
  };
  const onLaunch = async (key, kind, force) => {
    await api.launch(key, kind, force);
    load();
  };
  const onRefresh = async () => {
    setRefreshing(true);
    const asked = viewRef.current;
    const next = await api.refresh(asked);
    if (viewRef.current === asked) setData(next);
    setRefreshing(false);
  };

  const current = data?.prs.find((p) => p.key === selected);
  const errors = Object.entries(data?.errors || {});
  const todoCount = closed ? 0 : groups.find(([k]) => k === 'todo')?.[2].length || 0;
  const singleLabel = view.label && view.label !== '*';
  const scope = view.repo ? followedRepos.filter((r) => r.name === view.repo) : followedRepos;
  const oneFollowedLabel = !view.label && scope.length > 0 && scope.every((r) => r.labels.length === 1 && r.labels[0] === scope[0].labels[0]);

  useEffect(() => { document.title = todoCount ? `(${todoCount}) PR Dashboard` : 'PR Dashboard'; }, [todoCount]);

  return html`
    <div class="app">
      <header>
        ${data && followedRepos.length > 0 && html`<${ViewBar} view=${view} setView=${setView} repos=${followedRepos} />`}
        <span class="meta">${loading ? 'Chargement…' : `${data?.prs.length ?? 0} PR · ${closed ? '' : `${todoCount} à voir · `}mis à jour ${ago(data?.fetchedAt)}`}</span>
        ${data?.queue.length > 0 && html`<span class="queue">${data.queue.length} analyse${data.queue.length > 1 ? 's' : ''} en file (${shortRepo(data.queue[0].repo)}#${data.queue[0].n} ${KIND_LABEL[data.queue[0].kind].toLowerCase()} en cours)</span>`}
        ${errors.map(([repo, message]) => html`<span class="error" title=${message}>Erreur sur ${repo}</span>`)}
        <span class="spacer"></span>
        ${!closed && html`<label><input type="checkbox" checked=${showDrafts} onChange=${(e) => setShowDrafts(e.target.checked)} /> Drafts</label>`}
        <label><input type="checkbox" checked=${showMine} onChange=${(e) => setShowMine(e.target.checked)} /> Mes PR</label>
        <button onClick=${onRefresh} disabled=${refreshing}>${refreshing ? 'Rafraîchissement…' : 'Rafraîchir'}</button>
        <button onClick=${() => setSettingsOpen(true)} disabled=${!data}>Réglages</button>
        <${ThemeToggle} />
      </header>
      ${settingsOpen && html`<${Settings} current=${data.settings} onClose=${() => setSettingsOpen(false)}
        onSaved=${() => { setSettingsOpen(false); setLoading(true); load(); }} />`}
      <main>
        <div class="list">
          ${data && followedRepos.length === 0 && html`<p class="empty" style="padding: 24px 16px">Aucun repo suivi. Choisis-en dans les Réglages.</p>`}
          ${!loading && followedRepos.length > 0 && groups.length === 0 && html`<p class="empty" style="padding: 24px 16px">Aucune PR pour ces filtres.</p>`}
          ${groups.map(([k, label, list]) => html`
            <section class="group" key=${k}>
              <h2>${label} · ${list.length}</h2>
              ${list.map((pr) => html`<${Row} key=${pr.key} pr=${pr} selected=${pr.key === selected} onSelect=${setSelected} showLabels=${!singleLabel && !oneFollowedLabel} showRepo=${followedRepos.length > 1 && !view.repo} />`)}
            </section>`)}
        </div>
        <div class="detail">
          ${current
            ? html`<${Detail} key=${current.key} pr=${current} onLocal=${onLocal} onLaunch=${onLaunch} />`
            : html`<p class="empty">${data ? 'Choisis une PR dans la liste.' : 'Chargement…'}</p>`}
        </div>
      </main>
    </div>`;
}

if (window.__PR_DASHBOARD_APP__) {
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]');
    if (a && a.origin !== location.origin) {
      e.preventDefault();
      location.href = a.href;
    }
  });
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
